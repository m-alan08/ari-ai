# Root uv workspace for the Python control-plane packages.
#
# Build layout (ADR-0001, coordinated in coordination/messages/*-srihith-to-all-contracts-v0.md):
# every hyphenated top-level directory holds an import-valid Python package with
# its own pyproject.toml, e.g. `rl-defense/rl_defense`, `security-agents/security_agents`,
# `code-intelligence/code_intelligence`, `code-review/code_review`. Packages owned by
# other people join the workspace by adding their directory to `members` in their
# own PR (heavy deps such as torch stay opt-in).
[project]
name = "hackatl-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hackatl-standards", "hackatl-shared", "hackatl-monitoring", "hackatl-backend", "hackatl-code-intelligence", "hackatl-code-review", "security-agents", "ari-specialists"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["standards", "shared", "monitoring", "backend", "code-intelligence", "code-review", "security-agents", "specialists"]

[tool.uv.sources]
hackatl-standards = { workspace = true }
hackatl-shared = { workspace = true }
hackatl-monitoring = { workspace = true }
hackatl-backend = { workspace = true }
hackatl-code-intelligence = { workspace = true }
hackatl-code-review = { workspace = true }
security-agents = { workspace = true }
ari-specialists = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "pgserver>=0.1.4",       # embedded real PostgreSQL 16 for local tests when DATABASE_URL is unset
  "respx>=0.21",
  "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "monitoring/tests", "backend/tests", "code-review/tests", "standards/tests", "tests/security", "specialists/tests"]
addopts = "-ra"
# Lets the suites import the workspace packages where they are not installed (agent sandboxes).
pythonpath = ["backend", "shared", "monitoring", "standards", "code-intelligence"]
markers = [
  "live_llm: real Anthropic provider call; requires RUN_LIVE_LLM_EVAL=1 and a key",
  "db: needs PostgreSQL",
  "owasp_llm(category): evidence for an OWASP LLM Top 10 control",
  "live_defense_e2e: Live Defense owned-staging end-to-end scenario",
  "live_defense_smoke: fast subset of the Live Defense e2e suite",
  "live_defense_fault: failure-injection Live Defense e2e scenario",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
mypy_path = "shared:monitoring:backend:standards"
explicit_package_bases = true
files = ["shared/shared", "monitoring/monitoring", "standards/standards"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "standards", "backend", "monitoring", "rl_defense", "security_agents", "code_intelligence", "code_review"]
