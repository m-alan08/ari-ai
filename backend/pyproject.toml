[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackatl-backend"
version = "0.1.0"
description = "Control plane: FastAPI API, PostgreSQL persistence, durable job queue, worker, LLM gateway, GitHub integration"
requires-python = ">=3.12"
dependencies = [
  "hackatl-shared",
  "hackatl-monitoring",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "anthropic>=0.40",
  "pyjwt[crypto]>=2.9",
]

[project.scripts]
hackatl-api = "backend.cli:serve"
hackatl-worker = "backend.cli:worker"
hackatl-migrate = "backend.cli:migrate"
hackatl-preflight = "backend.cli:preflight"

[tool.uv.sources]
hackatl-shared = { workspace = true }
hackatl-monitoring = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["backend"]
